services:
  db:
    image: postgres:16
    container_name: backend-foundations-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: backend-foundations-redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgres_data:
