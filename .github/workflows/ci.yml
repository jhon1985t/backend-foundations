name: CI

on:
  push:
    branches: [ main, master, develop, release/* ]
  pull_request:
    branches: [ main, master, develop, release/* ]

jobs:
  test:
    name: Lint & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]  # puedes añadir "3.11" si quieres matriz

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 15s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6380:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry
        run: |
          poetry --version
          # Usar el entorno del runner (más rápido en CI)
          poetry config virtualenvs.create false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            if pg_isready -h localhost -p 5433 -U test_user; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres ($i/20)..."
            sleep 3
          done

      - name: Create test database
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -p 5433 -U test_user -d postgres -c "CREATE DATABASE app_test_db;" || echo "Database already exists"

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install deps
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Install app (for seeding script to import)
        run: poetry install --no-interaction --no-ansi

      - name: Run migrations
        env:
          DATABASE_URL: "postgresql+psycopg://test_user:test_password@localhost:5433/app_test_db"
        run: poetry run alembic upgrade head

      - name: Seed test user
        env:
          DATABASE_URL: "postgresql+psycopg://test_user:test_password@localhost:5433/app_test_db"
        run: |
          poetry run python - <<'PY'
          import sys
          from sqlalchemy import create_engine, text
          from app.auth.security import hash_password

          db_url = "postgresql+psycopg://test_user:test_password@localhost:5433/app_test_db"
          engine = create_engine(db_url)
          password_hash = hash_password("1234")

          try:
              with engine.begin() as conn:
                  conn.execute(text(
                      """
                      INSERT INTO users (email, full_name, password_hash)
                      VALUES (:email, :full_name, :password_hash)
                      ON CONFLICT (email) DO NOTHING
                      """
                  ), {
                      "email": "user@example.com",
                      "full_name": "string",
                      "password_hash": password_hash
                  })
              print("✓ Test user seeded successfully")
          except Exception as e:
              print(f"✗ Seeding failed: {e}", file=sys.stderr)
              sys.exit(1)
          finally:
              engine.dispose()
          PY

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Black (format check)
        run: poetry run black --check app tests

      - name: Pytest
        env:
          DATABASE_URL: "postgresql+psycopg://test_user:test_password@localhost:5433/app_test_db"
          REDIS_URL: "redis://localhost:6380/0"
        run: poetry run pytest -q

  docker-build:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t backend-foundations .

      - name: Run tests in container
        run: docker run --rm backend-foundations poetry run pytest -q
