name: CI

on:
  push:
    branches: [ main, master, develop, release/* ]
  pull_request:
    branches: [ main, master, develop, release/* ]

jobs:
  test:
    name: Lint & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13" ]  # puedes añadir "3.11" si quieres matriz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry
        run: |
          poetry --version
          # Usar el entorno del runner (más rápido en CI)
          poetry config virtualenvs.create false

      - name: Start PostgreSQL with Docker Compose
        run: |
          docker compose up db -d
          # Esperar a que PostgreSQL esté listo (max 30 segundos)
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            docker compose exec -T db pg_isready -U app_user -d postgres && break
            echo "Attempt $i/30: PostgreSQL not ready yet..."
            sleep 1
          done
          echo "PostgreSQL is ready!"
          # Crear la BD de prueba
          docker compose exec -T db psql -U app_user -d postgres -c "CREATE DATABASE app_test_db;" || echo "Database already exists"

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install deps
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Black (format check)
        run: poetry run black --check app tests

      - name: Pytest
        run: poetry run pytest -q

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down

  docker-build:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t backend-foundations .

      - name: Run tests in container
        run: docker run --rm backend-foundations poetry run pytest -q
