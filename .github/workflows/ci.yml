name: CI

on:
  push:
    branches: [ main, master, develop, release/* ]
  pull_request:
    branches: [ main, master, develop, release/* ]

jobs:
  test:
    name: Lint & Tests (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Configure Poetry
        run: |
          poetry --version
          # Usar el entorno del runner (más rápido en CI)
          poetry config virtualenvs.create false

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install deps
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Install app (for seeding script to import)
        run: poetry install --no-interaction --no-ansi

      - name: Check argon2 installation
        run: |
          poetry run python -c "import argon2; print(f'✓ argon2-cffi installed')"
          poetry run python -c "from passlib.context import CryptContext; print('✓ passlib installed')"
          poetry run python -c "from app.auth.security import hash_password, verify_password; h = hash_password('test'); print(f'✓ Password hashing works: {h[:30]}...')"

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Black (format check)
        run: poetry run black --check app tests

      - name: Clean test database
        run: rm -f test_db.sqlite

      - name: Setup test database (SQLite)
        env:
          DATABASE_URL: "sqlite:///./test_db.sqlite"
        run: poetry run python scripts/init_test_db.py

      - name: Diagnose DB before pytest
        env:
          DATABASE_URL: "sqlite:///./test_db.sqlite"
        run: |
          poetry run python - <<'PY'
          import os
          from sqlalchemy import inspect, select, func
          from app.db import engine, SessionLocal
          from app.users.models import User

          print("DATABASE_URL:", os.getenv("DATABASE_URL"))
          print("Engine URL:", engine.url)
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          print("Tables:", tables)

          with SessionLocal() as db:
              try:
                  count = db.scalar(select(func.count()).select_from(User))
                  print("Users count:", count)
              except Exception as e:
                  print("Users count check failed:", e)
          PY

      - name: Pytest (SQLite)
        env:
          DATABASE_URL: "sqlite:///./test_db.sqlite"
        run: poetry run pytest -q

  docker-build:
    name: Docker Build (smoke)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg INSTALL_DEV=true -t backend-foundations .

      - name: Run tests in container
        run: docker run --rm backend-foundations poetry run pytest -q
