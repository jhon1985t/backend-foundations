[project]
name = "backend-foundations"
version = "0.1.0"
description = ""
authors = [
    {name = "jhonjto",email = "jhon1985t@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.121.1,<0.122.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "psycopg[binary] (>=3.3.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
black = "^25.11.0"
ruff = "^0.14.4"
pre-commit = "^4.4.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.3.0"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
